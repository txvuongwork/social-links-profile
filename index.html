<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main>
      <article class="card">
        <figure class="avatar">
          <img
            src="./assets/images/avatar-jessica.jpeg"
            alt="Jessica Randall"
          />
        </figure>

        <header>
          <h1 class="name">Jessica Randall</h1>
          <p class="location">London, United Kingdom</p>
        </header>

        <p class="description">
          &#34;Front-end developer and avid reader.&#34;
        </p>

        <nav>
          <ul class="social-links">
            <li>
              <a
                class="social-link"
                href="https://github.com/txvuongwork"
                aria-label="Visit my GitHub profile"
                target="_blank"
                >GitHub</a
              >
            </li>
            <li>
              <a
                class="social-link"
                href="https://www.frontendmentor.io/profile/txvuongwork"
                aria-label="View my Frontend Mentor profile"
                target="_blank"
                >Frontend Mentor</a
              >
            </li>
            <li>
              <a
                class="social-link"
                href="https://www.linkedin.com/in/vuong-truong-8415b0386/"
                target="_blank"
                aria-label="Connect on LinkedIn"
                >LinkedIn</a
              >
            </li>
            <li>
              <a
                class="social-link"
                href="https://twitter.com/username"
                aria-label="Follow me on Twitter"
                target="_blank"
                >Twitter</a
              >
            </li>
            <li>
              <a
                class="social-link"
                href="https://instagram.com/username"
                aria-label="See my Instagram"
                target="_blank"
                >Instagram</a
              >
            </li>
          </ul>
        </nav>
      </article>
    </main>
  </body>
</html>
